<!doctype html>
<!--
  PÁGINA PRINCIPAL
  Qué es: la única página de la aplicación. Solo define la estructura; el contenido de las respuestas
  lo dibuja web/app.js y la apariencia está en web/style.css.
  Bloques: barra superior (estado y accesos) -> formulario de pregunta -> progreso -> error -> respuesta
  -> panel lateral de detalle (fuentes, calidad de datos, alertas).
  Solo tema claro y sin recursos externos (funciona sin internet).
-->
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>Analista comercial de Brío</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <!-- BLOQUE: barra superior con título, estado de Ollama y accesos a los paneles -->
  <header class="topbar">
    <div class="brand">
      <h1>Analista comercial de Brío</h1>
      <p>Respuestas con cálculos verificables y fuentes citables</p>
    </div>
    <div class="topbar-actions">
      <span id="status" class="status status-wait" role="status">Comprobando…</span>
      <button id="btn-quality" class="link-btn" type="button">Calidad de datos</button>
      <button id="btn-security" class="link-btn" type="button">Alertas de seguridad</button>
    </div>
  </header>

  <!-- BLOQUE: contenido principal -->
  <main>
    <noscript><p class="banner banner-error">Esta página necesita JavaScript activado.</p></noscript>

    <!-- Formulario de pregunta: texto, botón, opción de búsqueda y preguntas de ejemplo -->
    <section class="card ask" aria-labelledby="ask-title">
      <h2 id="ask-title">Haz una pregunta sobre Brío</h2>
      <label for="question" class="sr-only">Pregunta</label>
      <textarea id="question" rows="3" maxlength="1000"
        placeholder="Por ejemplo: ¿Cuál fue la región con mayor caída porcentual entre T1 y T2?"></textarea>
      <div class="ask-actions">
        <button id="ask-btn" class="primary" type="button">Preguntar</button>
        <span class="hint">Ctrl + Enter</span>
        <details class="options">
          <summary>Opciones</summary>
          <label for="mode">Búsqueda en documentos</label>
          <select id="mode">
            <option value="">Por defecto</option>
            <option value="semantic">Semántica (por significado)</option>
            <option value="hybrid">Híbrida (significado + palabras clave)</option>
            <option value="lexical">Léxica (solo palabras clave)</option>
          </select>
        </details>
      </div>
      <div class="examples">
        <p>Preguntas de ejemplo:</p>
        <div id="examples" class="chip-row"></div>
      </div>
    </section>

    <!-- Progreso de los cinco pasos mientras se responde -->
    <section id="progress" class="card progress" hidden aria-live="polite">
      <ol id="steps"></ol>
      <p id="elapsed" class="hint"></p>
    </section>

    <!-- Mensaje de error (se rellena desde app.js) -->
    <div id="error" class="banner banner-error" role="alert" hidden></div>

    <!-- Respuesta: app.js dibuja aquí las tarjetas -->
    <article id="answer" hidden aria-label="Respuesta"></article>
  </main>

  <!-- BLOQUE: panel lateral (fuentes citadas, calidad de datos, alertas de seguridad) -->
  <div id="overlay" class="overlay" hidden></div>
  <aside id="drawer" class="drawer" hidden aria-label="Detalle">
    <div class="drawer-head">
      <h2 id="drawer-title"></h2>
      <button id="drawer-close" class="link-btn" type="button">Cerrar</button>
    </div>
    <div id="drawer-body" class="drawer-body"></div>
  </aside>

  <!-- Lógica de la página (sin librerías externas) -->
  <script src="/static/app.js" defer></script>
</body>
</html>
